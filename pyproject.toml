[project]
name = "caissa"
version = "0.1.0"
description = "AlphaZero-style self-play reinforcement learning for board games, playable in the browser"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caissa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
